<nav class="app-header">
  <div class="header-content">
    <div class="header-brand">
      <a routerLink="/" class="brand-link">
        <img src="logo.png" alt="AdminLTE Logo" class="brand-image" />
        <span class="brand-text">LearningSystem</span>
      </a>
    </div>

    <div class="header-actions">
      @if (userService.currentUser(); as user) {
      <div class="user-menu-item">
        <a routerLink="/profile" class="user-link">
          <img src="default-pfp.png" class="user-avatar" alt="User Image" />
          <span class="user-name">{{ user.fullName }}</span>
        </a>
        <button (click)="logout()" class="logout-btn">Logout</button>
      </div>
      } @else {
      <div class="auth-links">
        <a routerLink="/login" class="nav-link">Login</a>
        <a routerLink="/register" class="nav-link">Register</a>
      </div>
      }
    </div>
  </div>
</nav>
