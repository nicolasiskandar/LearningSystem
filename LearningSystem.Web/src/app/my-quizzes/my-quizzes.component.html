<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-6">My Quizzes</h1>

  <div *ngIf="loading()">
    <p>Loading...</p>
  </div>

  <div *ngIf="!loading() && attempts().length === 0">
    <p>You haven't taken any quizzes yet.</p>
  </div>

  <div *ngIf="!loading() && attempts().length > 0" class="overflow-x-auto">
    <table class="min-w-full bg-white shadow-md rounded-lg overflow-hidden">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quiz</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Score</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr *ngFor="let attempt of attempts()">
          <td class="px-6 py-4 whitespace-nowrap">{{ getQuizTitle(attempt.quizId) }}</td>
          <td class="px-6 py-4 whitespace-nowrap">{{ attempt.attemptDate | date:'medium' }}</td>
          <td class="px-6 py-4 whitespace-nowrap font-bold">{{ attempt.score }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
